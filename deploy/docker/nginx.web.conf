# nginx config for the tenant web container.
#
# Responsibilities:
#   1. Serve the React SPA from /usr/share/nginx/html with index.html
#      fallback for client-side routing.
#   2. Reverse-proxy /api/v1/ to the api service (docker-compose's
#      internal DNS resolves "api" to the api container).
#   3. Serve /uploads/ through the same proxy so document downloads
#      look like they come from the same origin.
#   4. Expose a tiny /health.txt for container healthchecks.
#
# Production-mode security headers are applied by the API (via @fastify/
# helmet); on the web side we just add a couple that helmet can't
# (X-Frame-Options on the static HTML, basic caching).
#
# The SPA's Content-Security-Policy is NOT here. It is baked into
# index.html as a <meta> by the build (see apps/web/vite.config.ts), so
# it travels with the artifact to every deployment — including a plain
# `dist/` on a host nobody configured. The one directive <meta> cannot
# express is frame-ancestors: the parser ignores it there. That one is
# below, as a real header, and it is the only CSP directive this file
# owns. Two policies on one response intersect, so the meta's
# restrictions still apply in full.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health probe target. Plain text so the Docker HEALTHCHECK is cheap.
    location = /health.txt {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Static assets — cache aggressively. Vite emits content-hashed
    # filenames so cache-busting is automatic on a new build.
    location ~* \.(?:js|mjs|css|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Same inheritance rule as `location /` below: declaring
        # Cache-Control here drops every server-level add_header, and
        # nosniff is the one that matters on a bundle.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # API + uploads proxy. Trailing-slash trimming matters: the API
    # expects /api/v1/<route>, not /api/v1//<route>.
    location /api/v1/ {
        proxy_pass http://api:3001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Larger body for KYC document uploads (cap at 6 MB to leave
        # headroom over the API's 5 MB limit; the API's the source of
        # truth for the actual limit).
        client_max_body_size 6m;
    }

    location /uploads/ {
        proxy_pass http://api:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Document downloads benefit from intermediate caching.
        expires 5m;
    }

    # Swagger UI is reachable behind the same origin for convenience.
    location /docs {
        proxy_pass http://api:3001/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: anything else goes to index.html so client-side
    # routing works on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        # Don't cache the entry HTML — it references hashed asset
        # filenames that must be re-fetched on every deploy.
        add_header Cache-Control "no-cache, must-revalidate";

        # Repeated, not inherited — see the note at the foot of this file.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # Lightweight security headers. @fastify/helmet handles the
    # API responses; this covers the static HTML.
    #
    # These reach the PROXIED locations (which declare no add_header of
    # their own) and nothing else. nginx does not merge add_header
    # across levels: a location that declares even one add_header
    # inherits NONE from the server block. `location /` — the one that
    # actually serves index.html — declares Cache-Control, so before the
    # copies above were added it silently received none of these. The
    # X-Frame-Options: DENY on this file has never applied to the app
    # shell it was written for.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
}
