<!doctype html>
<!--
  THEME SYNC NOTE
  This file is served by the service worker before any JS/CSS bundles
  attach, so it can't read from CSS variables or theme.ts. The hex
  values below MUST mirror `apps/web/src/theme.ts`:
    background  #14171c   (themeColors.background)
    foreground  #dbe1e8   (themeColors.foreground, used via #e0f2fe tint here)
    primary     #54b6e8   (themeColors.primary, used via #0284c7 darker shade)
  When you update theme.ts, grep this file for the old hex and replace.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14171c" />
    <title>SmartLoan · Offline</title>
    <style>
      /* Inline styles only — the service worker serves this exact file when
         a navigation request fails, before any of our React bundles have
         loaded. Anything we link to externally might also be unreachable. */
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #14171c;
        color: #e0f2fe;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 420px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 2rem;
        backdrop-filter: blur(12px);
        text-align: center;
      }
      .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        width: 48px;
        border-radius: 8px;
        background: rgba(125, 211, 252, 0.1);
        border: 1px solid rgba(125, 211, 252, 0.3);
        margin-bottom: 1rem;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
      p  { font-size: 0.875rem; color: rgba(255, 255, 255, 0.65); margin: 0 0 1.25rem; line-height: 1.5; }
      button {
        appearance: none;
        background: #0284c7;
        color: white;
        border: 0;
        padding: 0.625rem 1rem;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background 120ms;
      }
      button:hover { background: #0369a1; }
      .hint { font-size: 0.75rem; color: rgba(255, 255, 255, 0.45); margin-top: 1rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">
        <!-- "wifi-off" lucide icon, inlined to avoid external requests. -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01"/>
          <path d="M8.5 16.4a5 5 0 0 1 7 0"/>
          <path d="M5 12.9a10 10 0 0 1 5-2.6"/>
          <path d="M2 8.8a15 15 0 0 1 4.2-2.6"/>
          <path d="M18 7l2 2"/>
          <path d="m2 2 20 20"/>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        SmartLoan needs an internet connection to load. Loan decisioning, account
        balances, and audit trail must always reflect the latest server state —
        so we don't risk serving stale data offline.
      </p>
      <button onclick="window.location.reload()">Retry</button>
      <p class="hint">Once your connection returns, click Retry to continue.</p>
    </main>
  </body>
</html>
