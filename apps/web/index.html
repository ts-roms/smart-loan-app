<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The %THEME_COLOR_BG% token is replaced at build time by the
         `injectThemeTokens` Vite plugin, which sources its value from
         `src/theme.ts`. That same file feeds the PWA manifest, so the
         status-bar / install-banner / app-shell colours stay in lock-step.
         Runtime UI gets its colours from CSS variables in
         libs/ui/src/globals.css (also kept in sync with theme.ts). -->
    <meta name="theme-color" content="%THEME_COLOR_BG%" />
    <!-- Favicon (browser tab) + apple-touch-icon (iOS Add-to-Home-Screen). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <!-- PWA hints — when installed via Safari, these control the standalone
         status bar style. The manifest covers Chrome / Edge / Brave. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartLoan" />
    <title>SmartLoan</title>
    <!--
      Apply the stored theme before the first paint. React mounts a few
      hundred ms later; without this, a dark-theme user sees a white
      flash on every load. Kept inline and tiny on purpose — it must run
      before the stylesheet paints, so it can't be an imported module.
      Mirrors storedTheme() in src/providers/theme.tsx.
    -->
    <script>
      try {
        if (localStorage.getItem("loan.theme") === "dark")
          document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
