server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compression for the bundled assets
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Long-cache the hashed asset bundle. Vite already content-hashes files,
  # so they can be cached aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # PWA service worker — MUST NOT be browser-cached. The whole update
  # mechanism relies on the browser re-fetching sw.js to discover new
  # builds. Without no-cache here, users would be stuck on whichever
  # SW they first downloaded for as long as their cache survives.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
    try_files $uri =404;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
    try_files $uri =404;
  }
  location = /workbox-*.js {
    # Workbox runtime is content-hashed by vite-plugin-pwa, but keep
    # the cache header short so stale references resolve quickly.
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # PWA manifest — also no-cache so changes ship immediately. The file
  # is tiny; bypassing cache costs ~1 KB per page load.
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    add_header Content-Type "application/manifest+json";
    try_files $uri =404;
  }

  # Proxy the API to the `api` service on the docker network.
  # Hostname `api` matches the service name in docker-compose.yml.
  location /api/ {
    proxy_pass         http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # KYC docs / customer ID scans served by the API as static files.
  location /uploads/ {
    proxy_pass         http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  # Fallback for the SPA — every unknown path returns index.html so
  # react-router can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
