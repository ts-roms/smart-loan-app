server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compression for the bundled assets
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Long-cache the hashed asset bundle. Vite already content-hashes files,
  # so they can be cached aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Proxy the API to the `api` service on the docker network.
  # Hostname `api` matches the service name in docker-compose.yml.
  location /api/ {
    proxy_pass         http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # KYC docs / customer ID scans served by the API as static files.
  location /uploads/ {
    proxy_pass         http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  # Fallback for the SPA — every unknown path returns index.html so
  # react-router can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
