# ──────────────────────────────────────────────────────────────────────────
# Smart Loan — docker compose
#
# Two ways to use this file:
#
# 1) Local dev — just the database, run api + web on the host:
#       docker compose up -d postgres
#       pnpm dev
#
# 2) Full stack — containerized api + web + db + pgadmin:
#       docker compose --profile full up -d --build
#
#    Then visit:
#       http://localhost:5173   (web — nginx serving the vite build,
#                                proxies /api and /uploads to the api
#                                container on the internal network)
#       http://localhost:3001   (api direct, e.g. /docs for swagger)
#       http://localhost:5050   (pgadmin — admin@loan.local / admin)
# ──────────────────────────────────────────────────────────────────────────

name: smart-loan

services:
  # ── Database ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smart-loan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loan}
      POSTGRES_DB: ${POSTGRES_DB:-smart_loan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - loan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-loan} -d ${POSTGRES_DB:-smart_loan}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [loan-net]

  # ── API (Fastify) ─────────────────────────────────────────────────────
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: smart-loan-api:local
    container_name: smart-loan-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-loan}:${POSTGRES_PASSWORD:-loan}@postgres:5432/${POSTGRES_DB:-smart_loan}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-please-32-chars-minimum}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      UPLOADS_DIR: /app/uploads
      # Optional — only set when the `ai` profile is up. Without this
      # the assistant routes return mock responses (no hard dependency).
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - loan-uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [loan-net]

  # ── Web (React PWA served by nginx) ───────────────────────────────────
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: smart-loan-web:local
    container_name: smart-loan-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
    networks: [loan-net]

  # ── Local LLM (Ollama, optional — only with `ai` profile) ─────────────
  # Spin this up alongside the api when you want the assistant features:
  #
  #   docker compose --profile full --profile ai up -d --build
  #
  # On first start, pull the model (one-time, ~2.3 GB for phi3:mini):
  #
  #   docker compose --profile ai exec ollama ollama pull phi3:mini
  #
  # The api container reaches it at http://ollama:11434 via the shared
  # loan-net network. With no OLLAMA_URL env var set, assistant endpoints
  # return a "configure Ollama" mock — the rest of the app works fine.
  #
  # If your host has a GPU you can pass `--gpus all` to the container at
  # runtime for much faster inference; the default CPU mode works on
  # any machine but is slow (~5-15s/response for phi3:mini).
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: smart-loan-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - loan-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [loan-net]

  # ── pgAdmin (optional — only with full profile) ───────────────────────
  pgadmin:
    profiles: ["full"]
    image: dpage/pgadmin4:latest
    container_name: smart-loan-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@loan.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - loan-pgadmin:/var/lib/pgadmin
    networks: [loan-net]

volumes:
  loan-pgdata:
  loan-uploads:
  loan-pgadmin:
  loan-ollama:

networks:
  loan-net:
    driver: bridge
